name: software-contracts
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps -r requirements-cpu.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check src/netembed tests scripts
      - run: python -m ruff format --check src/netembed tests scripts
      - run: python -m pytest -q
      - run: netembed --help
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
